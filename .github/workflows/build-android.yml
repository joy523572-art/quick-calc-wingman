    name: Build Android Release AAB + Mapping
    on:
      workflow_dispatch:

    jobs:
      build:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-node@v4
            with: { node-version: '20', cache: 'npm' }
          - run: npm ci
          - run: npm run build
          - uses: actions/setup-java@v4
            with: { distribution: 'temurin', java-version: '17' }
          - run: npx cap sync android
          - run: cd android && ./gradlew bundleRelease
          - uses: actions/upload-artifact@v4
            with: { name: release-aab, path: android/app/build/outputs/bundle/release/app-release.aab }
          - uses: actions/upload-artifact@v4
            with: { name: mapping-txt, path: android/app/build/outputs/mapping/release/mapping.txt }
