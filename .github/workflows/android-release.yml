name: Build Android Release (AAB + Mapping)

# Runs when you push to main, open a pull request, or press the "Run workflow" button.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android-release:
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js so we can build the web app and run Capacitor CLI
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Install npm dependencies and build the production web app
      - name: Install dependencies and build web app
        run: |
          npm ci
          npm run build

      # 4. Set up Java 17 (required by Android Gradle Plugin 8.x)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 5. Set up the Android SDK command-line tools
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: true

      # 6. Install the exact SDK platforms and build-tools this project needs
      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      # 7. Sync the Capacitor Android project with the freshly built dist/ folder
      - name: Sync Capacitor Android project
        run: npx cap sync android

      # 8. Decode the upload keystore from the GitHub secret into android/app/keystore.jks
      #    Create the keystore secret by running:
      #    base64 -i your-upload-keystore.jks | pbcopy   (Mac)
      #    base64 -i your-upload-keystore.jks -w 0      (Linux)
      #    Then paste it in GitHub → Settings → Secrets and variables → Actions → New repository secret
      #    Name: KEYSTORE_BASE64
      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            echo "See the workflow comments for how to create and add it."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks

      # 9. Build the release App Bundle.
      #    Signing config is injected from repository secrets so Play Console accepts the AAB.
      - name: Build release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=app/keystore.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --no-daemon

      # 10. Upload the signed AAB as a downloadable artifact
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # 11. Upload the ProGuard/R8 deobfuscation mapping file
      #     Upload this same file to Play Console to remove the
      #     "There is no deobfuscation file associated with this App Bundle" warning.
      - name: Upload mapping.txt artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapping-release
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      # 12. (Optional) Clean up the decoded keystore from the runner
      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/keystore.jks
